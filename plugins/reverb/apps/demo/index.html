<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SonoDS Reverb — Pro-R algorithmic reverb clone with per-frequency decay rate control">
  <title>SonoDS Reverb — Interactive Audio Plugin Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090b0e;
      color: #e0e6ed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .demo-header {
      width: 960px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #151820;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 20px;
      border-radius: 10px;
    }

    .demo-title {
      font-size: 16px;
      font-weight: 700;
      color: #00e5ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .demo-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button.btn {
      background: #00e5ff;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn:hover {
      background: #33ebff;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }

    button.btn-secondary {
      background: #1e232d;
      color: #e0e6ed;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    button.btn-secondary:hover {
      background: #282f3d;
    }

    select.demo-select {
      background: #1e232d;
      color: #e0e6ed;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    #pluginContainer {
      width: 960px;
      height: 600px;
    }

    .status-bar {
      margin-top: 12px;
      font-size: 12px;
      color: #707888;
      display: flex;
      gap: 16px;
    }
  </style>
</head>
<body>
  <div class="demo-header">
    <div class="demo-title">
      <span>SonoDS Reverb</span>
      <span style="font-size: 11px; font-weight: 400; color: #a0a6b8; background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 4px;">DSP WASM Core</span>
    </div>

    <div class="demo-controls">
      <select class="demo-select" id="audioSourceSelect">
        <option value="impulse">Pluck / Impulse Generator</option>
        <option value="drums">Synthesized Drum Rhythm</option>
        <option value="synth">Ambient Pad Synth</option>
        <option value="noise">Noise Burst</option>
      </select>

      <button class="btn" id="startAudioBtn">▶ Play Sound</button>
      <button class="btn btn-secondary" id="stopAudioBtn">⏹ Stop</button>
    </div>
  </div>

  <div id="pluginContainer">
    <sonods-reverb id="reverbPlugin"></sonods-reverb>
  </div>

  <div class="status-bar">
    <span id="statusText">Audio Context: Suspended (Click 'Play Sound' to activate)</span>
    <span>•</span>
    <span>Rust WASM Engine: Ready</span>
    <span>•</span>
    <span>SonoDS DSP v0.1.0</span>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
