[package]
name = "sonods-dsp-core"
version = "0.1.0"
edition = "2021"
description = "SonoDS Reverb DSP core — FDN engine, room models, decay-rate EQ, post EQ, dynamics"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
# For testing
approx = "0.5"

[profile.release]
opt-level = 3
lto = true
